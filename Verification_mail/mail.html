<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>验证函</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #eef2f3, #d4e6f1);
        }

        .letter {
            width: 80%;
            max-width: 500px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding-left: 80px;
            padding-bottom: 40px;
            padding-right: 80px;
            padding-top: 40px;
            position: relative;
            text-align: left; /* 修改为左对齐 */
        }

        .letter::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 1px dashed #ccc;
            z-index: -1;
            border-radius: 12px;
        }

        .letter-header h1 {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
            color: #2c3e50;
            text-align: left; /* 确保标题也左对齐 */
        }

        .letter-body {
            font-size: 18px;
            line-height: 1.6;
            margin-top: 20px;
            color: #555;
            text-align: left; /* 左对齐 */
        }

        .code-container{
            text-align: center;
        }

        .code {
            font-size: 30px;
            font-weight: bold;
            color: #2980b9;
            margin: 20px auto;
            padding: 12px 20px;
            border: 2px solid #2980b9;
            border-radius: 8px;
            display: inline-block;
            background-color: #ecf7ff;
        }

        .letter-footer {
            font-size: 14px;
            font-style: italic;
            color: #aaa;
            margin-top: 30px;
            text-align: center;
        }

        .background-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.05;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="letter">
        <div class="letter-header">
            <h1>验证函</h1>
        </div>
        <div class="letter-body">
            <p>您好，</p>
            <p>您正在我们的网站进行注册用户操作，我们向您的邮箱发送了一个验证码以确保是您本人在操作。</p>
            <p>您的验证码为：</p>
            <div class="code-container">
                <div class="code">{authCode}</div>
            </div>
            <p>请在5分钟内使用，以保证验证码的有效性。</p>
            <p>此邮件为系统自动发出，请勿回复本邮件。有任何问题，发送邮件至 872556642@qq.com，我们的客户服务团队会及时为您解答。</p>
        </div>
        <div class="letter-footer">
            <p>© 2025 OtterAI. All Rights Reserved.</p>
        </div>
    </div>
</body>
</html>
